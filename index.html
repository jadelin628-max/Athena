<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Athena 考研记忆：把考点拆成卡片，抽一张、背一张、对一张。数三 / 微观 / 统计 / 政治。">
  <meta name="theme-color" content="#D4537E">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Athena">
  <link rel="manifest" href="manifest.webmanifest?v=5">
  <link rel="icon" type="image/png" href="icons/favicon.png?v=5">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=5">
  <title>Athena · 考研知识点记忆</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="brand">
      <span class="brand-wordmark"><b>A</b>thena</span>
      <span id="brandText"></span>
    </div>
    <span id="countdownBadge" class="countdown-badge" title="考研倒计时"></span>
    <nav>
      <select class="subject-select" id="subjectSelect" title="切换学科" aria-label="切换学科"></select>
      <button class="nav-btn" data-action="nav" data-arg="learn">学习</button>
      <button class="nav-btn" data-action="nav" data-arg="browse">浏览</button>
      <button class="nav-btn" data-action="nav" data-arg="map">导图</button>
      <button class="nav-btn" data-action="nav" data-arg="quiz">自测</button>
      <button class="nav-btn" data-action="nav" data-arg="statistics">统计</button>
      <button class="nav-btn" data-action="nav" data-arg="principle">原理</button>
      <button class="nav-btn" data-action="nav" data-arg="settings">设置</button>
      <button class="icon-btn" id="themeToggle" title="切换明暗主题">🌓</button>
      <button class="icon-btn" id="immersiveToggle" title="沉浸模式（Esc 退出）">⛶</button>
    </nav>
  </header>

  <button class="icon-btn" id="immersiveExit" title="退出沉浸">✕</button>

  <main id="app"></main>

  <script src="data/math3.js"></script>
  <script src="data/econ.js"></script>
  <script src="data/stats.js"></script>
  <script src="data/politics.js"></script>
  <script src="app.js"></script>
</body>
</html>
