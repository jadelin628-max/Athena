<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Athena 考研记忆：把考点拆成卡片，抽一张、背一张、对一张。数三 / 微观 / 统计 / 政治。">
  <meta name="theme-color" content="#D4537E">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Athena">
  <link rel="manifest" href="manifest.webmanifest?v=61">
  <link rel="icon" type="image/png" href="icons/favicon.png?v=61">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=61">
  <title>Athena · 考研知识点记忆</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="brand">
      <div class="subject-dd" id="subjectDropdown">
        <button class="subject-dd-current" id="subjectCurrent" type="button" aria-haspopup="listbox" aria-expanded="false" title="切换学科 · 徽标为总体掌握度"></button>
      </div>
    </div>
    <nav>
      <button class="nav-btn" id="homeBtn" data-action="nav" data-arg="home" title="主页"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 L12 3.5 L20.5 11"/><path d="M6 9.5 V20 H18 V9.5"/><path d="M10 20 V14.5 H14 V20"/></svg></button>
      <button class="nav-btn module-tab" data-action="module" data-arg="cards"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="7.5" width="12.5" height="12.5" rx="2"/><path d="M8.5 4.5 H18 A2 2 0 0 1 20 6.5 V16"/></svg> 知识卡</button>
      <button class="nav-btn module-tab" data-action="module" data-arg="wrong"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M9 9 L15 15 M15 9 L9 15"/></svg> 错题本</button>
      <button class="icon-btn" id="themeToggle" title="切换明暗主题">🌓</button>
      <button class="icon-btn" id="immersiveToggle" title="沉浸模式（Esc 退出）">⛶</button>
      <button class="icon-btn" id="menuToggle" title="菜单" aria-label="打开菜单">☰</button>
    </nav>
  </header>

  <div class="subnav" id="subnav"></div>
  <div class="dock" id="dock"></div>

  <button class="icon-btn" id="immersiveExit" title="退出沉浸">✕</button>

  <div class="drawer-backdrop" id="drawerBackdrop" data-action="menuclose"></div>
  <nav class="drawer" id="drawer" aria-label="导航菜单">
    <div class="drawer-head">📚 菜单</div>
    <button class="nav-btn drawer-item" data-action="nav" data-arg="home"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 L12 3.5 L20.5 11"/><path d="M6 9.5 V20 H18 V9.5"/><path d="M10 20 V14.5 H14 V20"/></svg> 主页</button>
    <button class="nav-btn drawer-item" data-action="nav" data-arg="principle"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 9.5 L12 4.5 L21.5 9.5 L12 14.5 Z"/><path d="M6.5 11.8 V16.2 C6.5 17.8 17.5 17.8 17.5 16.2 V11.8"/><path d="M21.5 9.5 V14.5"/></svg> 原理</button>
    <button class="nav-btn drawer-item" data-action="nav" data-arg="settings"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7 H20 M4 12 H20 M4 17 H20"/><circle cx="9.5" cy="7" r="2.1"/><circle cx="15" cy="12" r="2.1"/><circle cx="10.5" cy="17" r="2.1"/></svg> 设置</button>
    <div class="drawer-foot">Athena · 考研知识点记忆</div>
  </nav>

  <!-- 学科下拉菜单：挂在 body 根节点（fixed 定位由 JS 计算），避免 sticky/backdrop-filter 祖先
       影响定位与命中测试（移动端 WebKit 上曾导致无法选中其他学科） -->
  <div class="subject-dd-menu hidden" id="subjectMenu" role="listbox"></div>

  <main id="app"></main>

  <script src="data/math3.js"></script>
  <script src="data/econ.js"></script>
  <script src="data/stats.js"></script>
  <script src="data/politics.js"></script>
  <script src="data/corp.js"></script>
  <script src="data/inv.js"></script>
  <script src="data/music.js"></script>
  <script src="data/poem.js"></script>
  <script src="data/py.js"></script>
  <script src="data/mon.js"></script>
  <script src="data/fsa.js"></script>
  <script src="data/sishu.js"></script>
  <script src="app.js"></script>
</body>
</html>
