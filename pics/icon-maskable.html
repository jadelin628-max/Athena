<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: transparent; }
  svg { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<!-- maskable 版：背景铺满（无圆角，供系统圆形/异形遮罩裁剪），图形整体缩小以落入安全区 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" shape-rendering="geometricPrecision">
  <rect x="0" y="0" width="200" height="200" fill="#F4C0D1"/>
  <g transform="translate(100 100) scale(0.86) translate(-100 -100)">
    <rect x="42" y="38" width="100" height="128" rx="12" fill="#B5D4F4" transform="rotate(-9 92 102)"/>
    <g transform="rotate(4 108 108)">
      <rect x="58" y="44" width="100" height="128" rx="12" fill="#FFFFFF"/>
      <rect x="74" y="76" width="52" height="9" rx="4.5" fill="#B5D4F4"/>
      <rect x="74" y="93" width="36" height="9" rx="4.5" fill="#F4C0D1"/>
    </g>
    <circle cx="140" cy="150" r="17" fill="#D4537E"/>
    <path d="M131.5 150 l6 6 l11 -12" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
</body>
</html>
