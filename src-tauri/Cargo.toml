[package]
name = "athena"
version = "1.13.1"
description = "Athena 考研知识点记忆"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "athena_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
